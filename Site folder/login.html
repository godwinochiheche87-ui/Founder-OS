<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Founder OS</title>

<!-- If a session already exists, skip straight to the app -->
<style>html{visibility:hidden;}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // TODO: replace with your real Supabase project values (Project Settings -> API)
  const SUPABASE_URL = "https://havhbckvcbuoakkzlelb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdmhiY2t2Y2J1b2Fra3psZWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzc4MDEsImV4cCI6MjEwMDgxMzgwMX0.QSiiMrvOR7Eb0vaWT49TmXD2T5YeccnIOxlAmCHZuJA";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const pageParams = new URLSearchParams(location.search);
  const isSignupMode = pageParams.get('mode') === 'signup' && pageParams.get('tx');

  (async function checkExisting(){
    // Don't short-circuit a fresh post-payment signup even if some old session lingers
    if(isSignupMode){
      document.documentElement.style.visibility = 'visible';
      return;
    }
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      setSessionCookiesEarly(session);
      window.location.replace(pageParams.get('redirect') || '/app.html');
      return;
    }
    document.documentElement.style.visibility = 'visible';
  })();

  // Same as setSessionCookies below, duplicated here since this runs before
  // the rest of the <script> block (further down the page) is parsed.
  function setSessionCookiesEarly(session){
    const isHttps = location.protocol === 'https:';
    const secure = isHttps ? '; Secure' : '';
    const maxAge = 60 * 60 * 24 * 30;
    document.cookie = `sb-access-token=${encodeURIComponent(session.access_token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`;
    document.cookie = `sb-refresh-token=${encodeURIComponent(session.refresh_token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`;
  }
</script>

<style>
:root{
  --bg:#0F1521;
  --panel:#161E2E;
  --panel-2:#1C2536;
  --line:#2A3548;
  --ink:#EDEFF3;
  --muted:#8894A8;
  --dim:#5C6883;
  --amber:#F2A93B;
  --teal:#4FD1C5;
  --red:#E2574C;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px;}
.wrap{width:100%;max-width:380px;padding:24px;}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.brandmark b{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.brandmark span{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.08em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;}
.card h1{font-size:17px;margin:0 0 4px;letter-spacing:-.01em;}
.card p.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;}
.badge{display:inline-block;background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.35);color:var(--teal);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:4px 8px;border-radius:var(--radius);margin-bottom:16px;}
label{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;}
input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);padding:10px 10px;font-size:13.5px;}
input:focus{outline:1px solid var(--amber);border-color:var(--amber);}
input[readonly]{color:var(--muted);}
button.primary{width:100%;margin-top:20px;background:var(--amber);color:#1a1206;border:none;border-radius:var(--radius);padding:11px 0;font-size:13.5px;font-weight:600;cursor:pointer;}
button.primary:disabled{opacity:.6;cursor:default;}
.msg{margin-top:14px;font-size:12.5px;padding:10px 12px;border-radius:var(--radius);display:none;}
.msg.error{display:block;background:rgba(226,87,76,.12);border:1px solid rgba(226,87,76,.35);color:#f2a49d;}
.msg.ok{display:block;background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.35);color:var(--teal);}
.foot{margin-top:16px;text-align:center;color:var(--dim);font-size:11.5px;}
.foot a{color:var(--teal);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandmark"><div class="dot"></div><div><b>FOUNDER OS</b><span id="brand-sub">self-serve build</span></div></div>

  <div class="card">
    <div id="signup-badge" class="badge" style="display:none;">✓ Payment verified</div>
    <h1 id="card-title">Welcome back</h1>
    <p class="sub" id="card-sub">Sign in to open your workspace.</p>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6">
      <button type="submit" class="primary" id="submit-btn">Sign in</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>
  <p class="foot" id="foot-text">Haven't purchased yet? <a href="/pay.html">Get started</a></p>
</div>

<script>
  const form = document.getElementById('auth-form');
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');
  const msgEl = document.getElementById('msg');
  const cardTitle = document.getElementById('card-title');
  const cardSub = document.getElementById('card-sub');
  const signupBadge = document.getElementById('signup-badge');
  const footText = document.getElementById('foot-text');
  const brandSub = document.getElementById('brand-sub');

  // Mirror the Supabase session into cookies so the Netlify Edge Function
  // (netlify/edge-functions/auth-guard.js) can verify it server-side, before
  // a protected page's HTML is ever sent to the browser.
  function setSessionCookies(session){
    const isHttps = location.protocol === 'https:';
    const secure = isHttps ? '; Secure' : '';
    const maxAge = 60 * 60 * 24 * 30; // 30 days; actual token expiry is what's really enforced
    document.cookie = `sb-access-token=${encodeURIComponent(session.access_token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`;
    document.cookie = `sb-refresh-token=${encodeURIComponent(session.refresh_token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`;
  }

  const txRef = pageParams.get('tx');
  const paidEmail = pageParams.get('email');
  const mode = isSignupMode ? 'signup' : 'signin';

  function showMsg(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'msg ' + kind;
  }

  if(mode === 'signup'){
    brandSub.textContent = 'create your account';
    signupBadge.style.display = 'inline-block';
    cardTitle.textContent = 'Create your account';
    cardSub.textContent = 'Payment received — set a password to finish.';
    submitBtn.textContent = 'Create account';
    footText.innerHTML = 'Already have an account? <a href="/login.html">Sign in</a>';
    passEl.setAttribute('autocomplete', 'new-password');
    if(paidEmail){
      emailEl.value = paidEmail;
      emailEl.readOnly = true;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    const prevLabel = submitBtn.textContent;
    submitBtn.textContent = mode === 'signin' ? 'Signing in…' : 'Creating account…';
    msgEl.className = 'msg';

    const email = emailEl.value.trim();
    const password = passEl.value;

    try{
      if(mode === 'signin'){
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        setSessionCookies(data.session);
        window.location.replace(pageParams.get('redirect') || '/app.html');
      } else {
        // Server-side gate: only succeeds if paid_customers has a matching,
        // unused row for this email + tx_ref. See netlify/functions/complete-signup.js
        const res = await fetch('/.netlify/functions/complete-signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, tx_ref: txRef }),
        });
        const data = await res.json();
        if(!res.ok){
          throw new Error(data.error || 'Could not create your account.');
        }

        // Account created -> sign in immediately to establish a session
        const { data: signInData, error: signInError } = await sb.auth.signInWithPassword({ email, password });
        if(signInError) throw signInError;
        setSessionCookies(signInData.session);
        window.location.replace('/app.html');
      }
    } catch(err){
      showMsg(err.message || 'Something went wrong. Please try again.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = prevLabel;
    }
  });
</script>
</body>
</html>
