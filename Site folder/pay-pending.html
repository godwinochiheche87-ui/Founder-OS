<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirming payment — Founder OS</title>
<style>
:root{
  --bg:#0F1521; --panel:#161E2E; --panel-2:#1C2536; --line:#2A3548;
  --ink:#EDEFF3; --muted:#8894A8; --dim:#5C6883;
  --amber:#F2A93B; --teal:#4FD1C5; --red:#E2574C;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px;}
.wrap{width:100%;max-width:380px;padding:24px;}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.brandmark b{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.brandmark span{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.08em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 24px;text-align:center;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);margin:0 auto 18px;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card h1{font-size:17px;margin:0 0 8px;letter-spacing:-.01em;}
.card p.sub{color:var(--muted);font-size:12.5px;margin:0;line-height:1.6;}
.timer{margin-top:16px;color:var(--dim);font-size:11px;font-family:var(--mono);}
.msg{margin-top:16px;font-size:12.5px;padding:10px 12px;border-radius:var(--radius);display:none;text-align:left;}
.msg.ok{display:block;background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.35);color:var(--teal);}
.msg.wait{display:block;background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.3);color:var(--amber);}
.foot{margin-top:16px;text-align:center;color:var(--dim);font-size:11.5px;}
.foot a{color:var(--teal);text-decoration:none;}
button.retry{margin-top:14px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:var(--radius);padding:8px 14px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandmark"><div class="dot"></div><div><b>FOUNDER OS</b><span>confirming payment</span></div></div>

  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Confirming your payment</h1>
    <p class="sub" id="sub">Bank transfers can take a couple of minutes to confirm. Don't close this tab — this will continue automatically once your transfer is confirmed.</p>
    <div class="timer" id="timer"></div>
    <div class="msg" id="msg"></div>
  </div>
  <p class="foot">Sent the money and it's taking a while? <a href="#" id="contact-link">Contact support</a></p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const txRef = params.get('tx');
  const emailHint = params.get('email');

  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const spinnerEl = document.getElementById('spinner');
  const timerEl = document.getElementById('timer');
  const msgEl = document.getElementById('msg');

  if(!txRef){
    titleEl.textContent = 'Something went wrong';
    subEl.textContent = 'We could not find your payment reference. Please start over.';
    spinnerEl.style.display = 'none';
  } else {
    let elapsed = 0;
    const intervalSeconds = 4;
    const maxSeconds = 180; // give up polling automatically after 3 minutes

    const poll = async () => {
      try {
        const res = await fetch(`/.netlify/functions/check-payment-status?tx_ref=${encodeURIComponent(txRef)}`);
        const data = await res.json();
        if(data.paid){
          spinnerEl.style.borderTopColor = 'var(--teal)';
          titleEl.textContent = 'Payment confirmed!';
          subEl.textContent = 'Taking you to create your account…';
          msgEl.textContent = 'Confirmed';
          msgEl.className = 'msg ok';
          clearInterval(timer);
          setTimeout(() => {
            window.location.replace(`/login.html?mode=signup&email=${encodeURIComponent(data.email || emailHint || '')}&tx=${encodeURIComponent(txRef)}`);
          }, 900);
          return;
        }
      } catch(e){ /* keep polling silently */ }

      elapsed += intervalSeconds;
      const remain = Math.max(0, maxSeconds - elapsed);
      const mm = Math.floor(remain / 60);
      const ss = String(remain % 60).padStart(2, '0');
      timerEl.textContent = elapsed < maxSeconds ? `still checking… ${mm}:${ss}` : '';

      if(elapsed >= maxSeconds){
        clearInterval(timer);
        spinnerEl.style.display = 'none';
        titleEl.textContent = "Still waiting on confirmation";
        subEl.textContent = "This is taking longer than usual. Your payment isn't lost — it just hasn't been confirmed yet. You can wait a bit longer and check again, or reach out to support with your payment reference below.";
        msgEl.textContent = `Reference: ${txRef}`;
        msgEl.className = 'msg wait';
        const retryBtn = document.createElement('button');
        retryBtn.className = 'retry';
        retryBtn.textContent = 'Check again';
        retryBtn.onclick = () => { window.location.reload(); };
        document.querySelector('.card').appendChild(retryBtn);
      }
    };

    const timer = setInterval(poll, intervalSeconds * 1000);
    poll(); // check immediately too, don't wait for the first interval
  }

  document.getElementById('contact-link').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Payment reference: ' + (txRef || 'unknown') + (emailHint ? ('\nEmail: ' + emailHint) : '') + '\n\nPlease share this with support.');
  });
</script>
</body>
</html>
