<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Founder OS</title>
<style>
:root{
  --bg:#0F1521; --panel:#161E2E; --panel-2:#1C2536; --line:#2A3548;
  --ink:#EDEFF3; --muted:#8894A8; --dim:#5C6883;
  --amber:#F2A93B; --teal:#4FD1C5; --red:#E2574C;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px;}
.wrap{width:100%;max-width:400px;padding:24px;}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.brandmark b{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.brandmark span{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.08em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;}
.card h1{font-size:17px;margin:0 0 4px;letter-spacing:-.01em;}
.card p.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;}

.pricebox{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:20px;}
.pricebox .amount{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--amber);}
.pricebox .tag{color:var(--dim);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

.curtoggle{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
.curtoggle button{flex:1;background:var(--panel-2);border:none;color:var(--muted);font-size:12px;padding:8px 0;cursor:pointer;font-family:var(--mono);letter-spacing:.04em;}
.curtoggle button.active{background:var(--amber);color:#1a1206;font-weight:600;}

label{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);padding:10px 10px;font-size:13.5px;}
input:focus{outline:1px solid var(--amber);border-color:var(--amber);}
button.primary{width:100%;margin-top:20px;background:var(--amber);color:#1a1206;border:none;border-radius:var(--radius);padding:11px 0;font-size:13.5px;font-weight:600;cursor:pointer;}
button.primary:disabled{opacity:.6;cursor:default;}
.msg{margin-top:14px;font-size:12.5px;padding:10px 12px;border-radius:var(--radius);display:none;}
.msg.error{display:block;background:rgba(226,87,76,.12);border:1px solid rgba(226,87,76,.35);color:#f2a49d;}
.foot{margin-top:16px;text-align:center;color:var(--dim);font-size:11.5px;}
.foot a{color:var(--teal);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandmark"><div class="dot"></div><div><b>FOUNDER OS</b><span>lifetime access</span></div></div>

  <div class="card">
    <h1>Get lifetime access</h1>
    <p class="sub">One payment. Your account unlocks right after checkout.</p>

    <div class="curtoggle">
      <button id="cur-ngn" class="active">₦ NGN</button>
      <button id="cur-usd">$ USD</button>
    </div>

    <div class="pricebox">
      <div class="amount" id="price-display">₦39980</div>
      <div class="tag">one-time payment</div>
    </div>

    <form id="pay-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      <button type="submit" class="primary" id="pay-btn">Pay now</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>
  <p class="foot">Already paid? <a href="/login.html">Sign in</a></p>
</div>

<script>
  // TODO: keep in sync with PRICE_NGN / PRICE_USD env vars (or their defaults) in
  // netlify/functions/initiate-payment.js -- this is just what's DISPLAYED here;
  // the amount actually charged always comes from the server, not this page.
  const PRICES = { NGN: 39980, USD: 33 };

  const priceDisplay = document.getElementById('price-display');
  const curNgnBtn = document.getElementById('cur-ngn');
  const curUsdBtn = document.getElementById('cur-usd');
  const form = document.getElementById('pay-form');
  const emailEl = document.getElementById('email');
  const payBtn = document.getElementById('pay-btn');
  const msgEl = document.getElementById('msg');

  // Light heuristic default -- the buyer can always override with the toggle.
  let currency = 'USD';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const lang = navigator.language || '';
    if (tz.includes('Africa') || /-NG$/i.test(lang) || /^ng/i.test(lang)) {
      currency = 'NGN';
    }
  } catch (e) { /* fall back to USD */ }

  function renderCurrency(){
    if(currency === 'NGN'){
      curNgnBtn.classList.add('active');
      curUsdBtn.classList.remove('active');
      priceDisplay.textContent = '₦' + PRICES.NGN.toLocaleString();
    } else {
      curUsdBtn.classList.add('active');
      curNgnBtn.classList.remove('active');
      priceDisplay.textContent = '$' + PRICES.USD.toLocaleString();
    }
  }
  renderCurrency();

  curNgnBtn.onclick = () => { currency = 'NGN'; renderCurrency(); };
  curUsdBtn.onclick = () => { currency = 'USD'; renderCurrency(); };

  function showError(text){
    msgEl.textContent = text;
    msgEl.className = 'msg error';
  }

  // Surface an error if we bounced back here from a failed verification
  const params = new URLSearchParams(location.search);
  if(params.get('error')){
    const reasons = {
      payment_not_completed: "It looks like the payment wasn't completed. Please try again.",
      verification_failed: "We couldn't verify that payment. Please try again or contact support.",
      recording_failed: "Payment succeeded but we hit a snag saving it. Please contact support with your email.",
      server_error: "Something went wrong on our end. Please try again.",
      server_misconfigured: "Payments aren't fully set up yet. Please try again shortly.",
    };
    showError(reasons[params.get('error')] || 'Something went wrong. Please try again.');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    payBtn.disabled = true;
    payBtn.textContent = 'Starting checkout…';
    msgEl.className = 'msg';

    try {
      const res = await fetch('/.netlify/functions/initiate-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailEl.value.trim(), currency }),
      });
      const data = await res.json();
      if(!res.ok || !data.link){
        throw new Error(data.error || 'Could not start payment.');
      }
      window.location.href = data.link; // off to Flutterwave's hosted checkout
    } catch(err){
      showError(err.message || 'Something went wrong. Please try again.');
      payBtn.disabled = false;
      payBtn.textContent = 'Pay now';
    }
  });
</script>
</body>
</html>
