<!-- ===== AUTH GUARD (Supabase) ===== -->
<!-- The real gate is the Netlify Edge Function (netlify/edge-functions/auth-guard.js),
     which checks the sb-access-token / sb-refresh-token cookies BEFORE this file is
     ever sent to the browser. This client-side script is defense-in-depth: it keeps
     the Supabase JS SDK's session (localStorage) and the cookies the edge function
     reads in sync, and reacts if the session ends while the tab is open. -->
<style>html{visibility:hidden;}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // TODO: replace with your real Supabase project values (Project Settings -> API)
  const SUPABASE_URL = "https://havhbckvcbuoakkzlelb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdmhiY2t2Y2J1b2Fra3psZWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzc4MDEsImV4cCI6MjEwMDgxMzgwMX0.QSiiMrvOR7Eb0vaWT49TmXD2T5YeccnIOxlAmCHZuJA";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  window.sb = sb; // exposed so the rest of the app (sign-out button, etc.) can use it

  function readCookies(){
    const out = {};
    document.cookie.split(';').forEach(part => {
      const i = part.indexOf('=');
      if(i === -1) return;
      out[part.slice(0, i).trim()] = decodeURIComponent(part.slice(i + 1).trim());
    });
    return out;
  }
  function writeSessionCookies(session){
    const isHttps = location.protocol === 'https:';
    const secure = isHttps ? '; Secure' : '';
    const maxAge = 60 * 60 * 24 * 30;
    document.cookie = `sb-access-token=${encodeURIComponent(session.access_token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`;
    document.cookie = `sb-refresh-token=${encodeURIComponent(session.refresh_token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${secure}`;
  }
  function clearSessionCookies(){
    document.cookie = 'sb-access-token=; Path=/; Max-Age=0; SameSite=Lax';
    document.cookie = 'sb-refresh-token=; Path=/; Max-Age=0; SameSite=Lax';
  }

  (async function guard(){
    let { data: { session } } = await sb.auth.getSession();

    // localStorage can be empty even though the edge function's cookie check
    // passed (e.g. a different browser profile) -- hydrate from the same cookies.
    if(!session){ 
      const cookies = readCookies();
      if(cookies['sb-access-token'] && cookies['sb-refresh-token']){
        const { data, error } = await sb.auth.setSession({
          access_token: cookies['sb-access-token'],
          refresh_token: cookies['sb-refresh-token']
        });
        if(!error) session = data.session;
      }
    }

    if(!session){
      const next = encodeURIComponent(location.pathname + location.search);
      window.location.replace('/login.html?redirect=' + next);
      return;
    }

    window.__authUser = session.user;
    writeSessionCookies(session);
    document.documentElement.style.visibility = 'visible';

    sb.auth.onAuthStateChange((event, newSession) => {
      if(event === 'SIGNED_OUT' || !newSession){
        clearSessionCookies();
        window.location.replace('/login.html');
      } else if(event === 'TOKEN_REFRESHED' || event === 'SIGNED_IN'){
        writeSessionCookies(newSession); // keep the edge function's cookie fresh too
      }
    });
  })();
</script>

/* Generic editable-table builder.
   cols: [{key,label,type:'text'|'number'|'select'|'checkbox',options,width}]
   rows: array of plain objects (mutated in place)
   root: container element */
function buildTable(root, cols, rows, opts={}){
  function cell(row, col){
    const val = row[col.key];
    if(col.type==='checkbox'){
      return `<input type="checkbox" data-k="${col.key}" ${val?'checked':''}>`;
    }
    if(col.type==='select'){
      return `<select data-k="${col.key}">${col.options.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
    }
    if(col.type==='readonly'){
      return `<span class="mono">${col.render?col.render(row):val}</span>`;
    }
    const t = col.type==='number' ? 'number':'text';
    return `<input type="${t}" data-k="${col.key}" value="${val===undefined?'':String(val).replace(/"/g,'&quot;')}">`;
  }
  function render(){
    root.innerHTML = `<div class="tablewrap"><table class="dt"><thead><tr>
      ${cols.map(c=>`<th>${c.label}</th>`).join('')}<th></th>
      </tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-i="${i}">${cols.map(c=>`<td>${cell(r,c)}</td>`).join('')}<td><button class="rowdel" data-del="${i}">✕</button></td></tr>`).join('')}
      </tbody></table></div>
      <button class="addrow" data-add="1">+ Add row</button>
      ${opts.capacity?`<div class="capnote">SCALES TO ${opts.capacity} ROWS · currently ${rows.length}</div>`:''}`;
  }
  root.addEventListener('input', e=>{
    const tr = e.target.closest('tr'); if(!tr) return;
    const i = +tr.dataset.i, k = e.target.dataset.k; if(k===undefined) return;
    const col = cols.find(c=>c.key===k);
    rows[i][k] = e.target.type==='checkbox' ? e.target.checked : (col && col.type==='number' ? Number(e.target.value) : e.target.value);
    if(opts.onChange) opts.onChange();
    if(opts.recompute) render();
  });
  root.addEventListener('change', e=>{
    if(e.target.tagName==='SELECT'){
      const tr = e.target.closest('tr'); const i=+tr.dataset.i, k=e.target.dataset.k;
      rows[i][k] = e.target.value; if(opts.onChange) opts.onChange();
    }
  });
  root.addEventListener('click', e=>{
    if(e.target.dataset.del!==undefined){ rows.splice(+e.target.dataset.del,1); render(); if(opts.onChange) opts.onChange(); }
    if(e.target.dataset.add!==undefined){ rows.push(opts.blank()); render(); }
  });
  render();
  return {render};
}

}

function downloadText(content, filename){
  const blob = new Blob([content], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function mdToWordHtml(md){
  const lines = md.split('\n');
  let html = '', inList = false;
  const closeList = ()=>{ if(inList){ html += '</ul>'; inList=false; } };
  const inlineFmt = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  lines.forEach(line=>{
    if(/^# /.test(line)){ closeList(); html += `<h1>${inlineFmt(line.slice(2))}</h1>`; }
    else if(/^## /.test(line)){ closeList(); html += `<h2>${inlineFmt(line.slice(3))}</h2>`; }
    else if(/^### /.test(line)){ closeList(); html += `<h3>${inlineFmt(line.slice(4))}</h3>`; }
    else if(/^-\s+/.test(line)){ if(!inList){ html+='<ul>'; inList=true; } html += `<li>${inlineFmt(line.replace(/^-\s+/,''))}</li>`; }
    else if(line.trim()===''){ closeList(); }
    else { closeList(); html += `<p>${inlineFmt(line)}</p>`; }
  });
  closeList();
  return html;
}
function downloadWordDoc(filename, title, md){
  const bodyHtml = mdToWordHtml(md);
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${title}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>
  body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1a1a1a;line-height:1.5;}
  h1{font-size:20pt;color:#B5791F;border-bottom:1px solid #ccc;padding-bottom:4px;}
  h2{font-size:14pt;color:#1a1a1a;margin-top:18pt;}
  h3{font-size:12pt;color:#333;}
  p{margin:0 0 8pt 0;}
  ul{margin:0 0 10pt 20pt;}
  li{margin-bottom:3pt;}
  b{color:#000;}
</style></head>
<body>${bodyHtml}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawLogo(canvas){
  const ctx = canvas.getContext('2d');
  const W = canvas.width = 1000, H = canvas.height = 500;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,H);
  const name = companyName();
  const primary = state.colorLock.primary || '#F2A93B';
  const secondary = state.colorLock.secondary || '#4FD1C5';
  const markSize = 200, mx = 90, my = (H-markSize)/2;
  roundRectPath(ctx, mx, my, markSize, markSize, 28); ctx.fillStyle = primary; ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = "700 110px 'Arial', sans-serif";
  ctx.fillText((name[0]||'F').toUpperCase(), mx+markSize/2, my+markSize/2+8);
  ctx.fillStyle = secondary; ctx.fillRect(mx, my+markSize+18, markSize, 10);
  ctx.textAlign = 'left'; ctx.fillStyle = '#161E2E';
  ctx.font = "700 68px 'Arial', sans-serif";
  ctx.fillText(name, mx+markSize+40, H/2-8);
  const tagline = (state.bmc.val || state.brandBrief.mission || '').slice(0,58);
  if(tagline){
    ctx.fillStyle = '#5C6883'; ctx.font = "400 26px 'Arial', sans-serif";
    ctx.fillText(tagline, mx+markSize+40, H/2+42);
  }
}

function renderSummary(){
  return `
  <div class="eyebrow">11 · Outputs</div>
  <h1 class="paneltitle">Business Summary</h1>
  <p class="subtitle">Every field you've filled in, across all eleven modules, assembled into formatted Microsoft Word documents you can hand to a bank, a co‑founder, or an investor. Nothing here is re‑typed — it's all pulled live from the OS, and each download opens directly in Word with headings, bold, and lists intact.</p>

  <div class="card">
    <h3>Investor inputs <span class="tag">used by Investment Proposal</span></h3>
    <div class="grid2">
      <div class="field"><label class="f">Funding ask</label><input type="number" id="sum-ask"></div>
      <div class="field"><label class="f">Use of funds notes (optional)</label><input id="sum-uof"></div>
    </div>
  </div>

  <div class="grid2" id="summary-cards"></div>

  <div class="card">
    <h3>Logo Output <span class="tag">JPEG, generated from your Naming & Identity Lab inputs</span></h3>
    <p class="hint">Uses your top‑scoring name candidate and the colors locked in on the Naming & Identity Lab page. Regenerate any time those change.</p>
    <canvas id="logo-canvas" style="width:100%;max-width:500px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;"></canvas>
    <div style="margin-top:12px;">
      <button class="btn ghost sm" id="logo-regen">Regenerate</button>
      <button class="btn sm" id="logo-download">Download .jpg</button>
    </div>
  </div>
  `;
}
function wireSummary(){
  $('#sum-ask').value = state.investor.raiseAmount || '';
  $('#sum-uof').value = state.investor.useOfFunds || '';
  $('#sum-ask').oninput = e=>state.investor.raiseAmount = Number(e.target.value)||0;
  $('#sum-uof').oninput = e=>state.investor.useOfFunds = e.target.value;

  const cards = $('#summary-cards');
  cards.innerHTML = Object.entries(summaryDocs).map(([key,d])=>`
    <div class="card">
      <h3>${d.title} <span class="tag">${d.tag}</span></h3>
      <p class="hint">${d.desc}</p>
      <div class="pretext" id="prev-${key}" style="display:none;max-height:280px;overflow:auto;"></div>
      <div style="margin-top:10px;">
        <button class="btn ghost sm" data-preview="${key}">Preview</button>
        <button class="btn sm" data-download="${key}">Download .doc</button>
      </div>
    </div>`).join('');

  cards.addEventListener('click', e=>{
    const pk = e.target.dataset.preview, dk = e.target.dataset.download;
    if(pk){
      const box = document.getElementById('prev-'+pk);
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : 'block';
      if(!open) box.textContent = summaryDocs[pk].build();
      e.target.textContent = open ? 'Preview' : 'Hide preview';
    }
    if(dk){
      downloadWordDoc(`${slug(companyName())}-${dk}.doc`, summaryDocs[dk].title, summaryDocs[dk].build());
      toast('Downloaded '+summaryDocs[dk].title+' (Word)');
    }
  });

  const canvas = $('#logo-canvas');
  drawLogo(canvas);
  $('#logo-regen').onclick = ()=>{ drawLogo(canvas); toast('Logo regenerated'); };
  $('#logo-download').onclick = ()=>{
    const url = canvas.toDataURL('image/jpeg', 0.92);
    const a = document.createElement('a'); a.href=url; a.download = slug(companyName())+'-logo.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Logo downloaded');
  };
}

const panels = {
  dashboard:{render:renderDashboard, wire:wireDashboard},
  ideation:{render:renderIdeation, wire:wireIdeation},
  naming:{render:renderNaming, wire:wireNaming},
  bizmodel:{render:renderBizmodel, wire:wireBizmodel},
  finance:{render:renderFinance, wire:wireFinance},
  product:{render:renderProduct, wire:wireProduct},
  gtm:{render:renderGtm, wire:wireGtm},
  hiring:{render:renderHiring, wire:wireHiring},
  ops:{render:renderOps, wire:wireOps},
  metrics:{render:renderMetrics, wire:wireMetrics},
  scale:{render:renderScale, wire:wireScale},
  summary:{render:renderSummary, wire:wireSummary},
  flow:{render:renderFlow, wire:null},
};
function gotoPanel(name){
  $$('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.p===name));
  const content = $('#content');
  content.innerHTML = panels[name].render();
  if(panels[name].wire) panels[name].wire();
  window.scrollTo({top:0, behavior:'instant'});
  content.scrollTop = 0;
}
$$('.navbtn').forEach(b=> b.onclick = ()=> gotoPanel(b.dataset.p));

function refreshGates(){
  const validationDone = state.validation.filter(v=>v.done).length;
  const ideaGate = true; // canvas started = always "on" once app is running
  const validateGate = validationDone >= 6;
  const brandGate = state.names.some(n=>nameScore(n) >= 8) && state.names.length>0;
  const launchGate = state.launch.filter(l=>l.done).length >= 4;
  const teamGate = state.candidates.offered.length >= 1;
  const gates = [ideaGate, validateGate, brandGate, launchGate, teamGate];
  const wrap = $('#gatewrap');
  const bars = ['Idea','Validate','Brand','Launch','Team'].map((label,i)=>{
    const cls = gates[i] ? 'gate on' : (i===gates.findIndex(g=>!g) ? 'gate cur' : 'gate');
    return `<span class="gname">${label}</span><span class="${cls}"></span>`;
  }).join('');
  wrap.innerHTML = bars;
}

function refreshDashboard(){ refreshDashboardPanel(); refreshHeaderCounts(); refreshGates(); }
function refreshHeaderCounts(){
  const monthly = state.budget.reduce((s,b)=>s+(Number(b.monthly)||0),0);
  $('#m-burn').textContent = fmt(monthly);
  const runway = monthly>0 ? (state.cash/monthly) : Infinity;
  const rEl = $('#m-runway');
  rEl.textContent = isFinite(runway) ? runway.toFixed(1)+' mo' : '∞';
  rEl.className = 'val mono ' + (isFinite(runway) && runway<3 ? 'crit' : isFinite(runway) && runway<6 ? 'warn' : 'good');
  const c = state.candidates;
  $('#m-hiring').textContent = c.applied.length+c.screened.length+c.interviewed.length;
  $('#m-decisions').textContent = state.decisions.length;
  $('#m-todos').textContent = state.todos.filter(t=>t.week && !t.done).length;
}

// central onChange hook used by many buildTable() calls
function refreshDashboardPanel(){
  refreshHeaderCounts();
  const dh = document.getElementById('dash-hiring');
  if(dh){
    const c = state.candidates;
    const total = c.applied.length+c.screened.length+c.interviewed.length+c.offered.length;
    dh.innerHTML = `Applied ${c.applied.length} → Screened ${c.screened.length} → Interviewed ${c.interviewed.length} → Offered ${c.offered.length}<br><span style="color:var(--dim)">${total} of 12‑seat pipeline capacity in motion</span>`;
  }
  const df = document.getElementById('dash-finance');
  if(df){
    const monthly = state.budget.reduce((s,b)=>s+(Number(b.monthly)||0),0);
    const runwayMonths = monthly>0 ? (state.cash/monthly) : Infinity;
    df.innerHTML = `Monthly burn: <b>${fmt(monthly)}</b><br>Cash on hand: <b>${fmt(state.cash)}</b><br>Runway: <b>${isFinite(runwayMonths)?runwayMonths.toFixed(1)+' months':'∞ (no recurring burn logged)'}</b>`;
  }
}

// boot
gotoPanel('dashboard');
refreshDashboard();

    signoutBtn.textContent = 'Signing out…';

    window.location.replace('/login.html');
